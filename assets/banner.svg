<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 019</title>
  <desc>Recognisable retro-modernist illustration with geometric hierarchy, multilingual documentation including Korean and Arabic, and the XXD lion mark.</desc>
  <defs>
